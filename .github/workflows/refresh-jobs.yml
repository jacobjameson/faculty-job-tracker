name: Refresh jobs and deploy dashboard

on:
  schedule:
    - cron: "15 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Collect approved university sources
        run: npm run refresh:jobs

      - name: Publish refresh audit to workflow summary
        run: npm run refresh:summary >> "$GITHUB_STEP_SUMMARY"

      - name: Validate catalog and application
        run: |
          npm run lint
          npm test

      - name: Build static dashboard
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/refresh-report.json config/catalog-history.json public/jobs.xml
          if git diff --cached --quiet; then
            echo "No catalog files changed."
          else
            git commit -m "Refresh faculty job catalog"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
